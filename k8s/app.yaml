# 평가시스템 앱(Next.js standalone) — KIOPS Cloud(구 KIWI) 배포 매니페스트.
#
# charzu-console 의 KIOPS 방식을 따른다: image 태그는 KIOPS 가 배포 시 선택한
# 빌드 버전으로 자동 교체한다. 이미지 경로·pull secret 이름은 KIOPS 프로젝트 등록 시
# 생성되는 값에 맞춰 조정할 것 (charzu-console 은 harbor.mipllab.com/<프로젝트>/service
# + <프로젝트>-registry-cred 였다).
#
# 사전 작업(최초 1회, 103 에서) — 앱 비밀값. Secret 객체가 없으면 pod 가
# CreateContainerConfigError 로 멈추므로 **첫 빌드 전에** 만든다:
#   kubectl -n ems create secret generic ems-secrets \
#     --from-literal=DATABASE_URL='postgresql://ems:<비밀번호>@ems-db:5432/ems' \
#     --from-literal=JWT_SECRET='<임의의 긴 문자열>' \
#     --from-literal=R2_ACCOUNT_ID='...' \
#     --from-literal=R2_ACCESS_KEY_ID='...' \
#     --from-literal=R2_SECRET_ACCESS_KEY='...' \
#     --from-literal=R2_BUCKET='...'
#   (값에 특수문자가 있으니 작은따옴표 필수 — 안 감싸면 # 뒤가 잘리고 $$ 가 PID 로 치환된다)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems
  namespace: ems
  labels:
    app: ems
spec:
  # 세션이 JWT 쿠키라 pod 에 상태가 없다 — 기본 RollingUpdate 로 무중단 교체 가능.
  replicas: 1
  selector:
    matchLabels:
      app: ems
  template:
    metadata:
      labels:
        app: ems
    spec:
      imagePullSecrets:
        - name: ems-registry-cred
      # 배포마다 스키마를 DB 에 맞춘다(멱등). DB 가 아직 안 떠 있으면 실패 → 재시도.
      initContainers:
        - name: migrate
          image: harbor.mipllab.com/evaluation-management-system/evaluation-management-system:latest
          command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: ems-secrets
      containers:
        - name: ems
          # 태그는 KIOPS 배포 시 선택한 빌드 버전으로 자동 교체됨
          image: harbor.mipllab.com/evaluation-management-system/evaluation-management-system:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: ems-secrets
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ems-service
  namespace: ems
  labels:
    app: ems
spec:
  type: ClusterIP
  selector:
    app: ems
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
